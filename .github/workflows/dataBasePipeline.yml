name: Database Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ParaBankATF
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize MySQL database
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot < src/test/resources/database/init.sql

      - name: Run Automation Tests
        run: mvn clean install
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/ParaBankATF
          DB_USER: root
          DB_PASSWORD: root